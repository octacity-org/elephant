# Generated by OmniShip from workflow.py. Do not edit directly.
name: CI
'on':
  push:
    branches:
    - main
  pull_request: {}
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  prepare:
    name: Check · Prepare
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
    - run: uvx --from omniship==0.6.0 omniship generate --check
  check-native-tests:
    name: Check · Native Tests
    needs: prepare
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        cache: true
        go-version-file: go.mod
    - name: Set up Zig
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
      with:
        version: 0.17.0
    - name: Check out ata-sesli/zova
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ata-sesli/zova
        ref: a30581ef7070ebc335fed06bbc46ea94a8326c5f
        path: .deps/zova
        persist-credentials: false
        fetch-depth: 1
        submodules: false
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.13'
    - name: Run Native Tests
      run: uvx --from omniship==0.6.0 omniship run-node --stage check --node native-tests --config omniship.yaml --export-artifacts .omniship/handoff/check-native-tests
      env:
        ELEPHANT_TARGET: ${{ matrix.target }}
        CGO_ENABLED: '1'
        OMNISHIP_REF_TYPE: ${{ github.ref_type }}
        OMNISHIP_REF_NAME: ${{ github.ref_name }}
        OMNISHIP_REVISION: ${{ github.sha }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: omniship-check-check-native-tests.${{ strategy.job-index }}
        path: .omniship/handoff/check-native-tests
        include-hidden-files: true
        retention-days: 7
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-24.04-arm
        - ubuntu-24.04
        - windows-2022
        - macos-15
        include:
        - runner: ubuntu-24.04-arm
          target: linux-arm64
        - runner: ubuntu-24.04
          target: linux-amd64
        - runner: windows-2022
          target: windows-amd64
        - runner: macos-15
          target: macos-arm64
  check-complete:
    name: Check complete
    needs: check-native-tests
    runs-on: ubuntu-24.04
    steps:
    - run: echo 'check stage complete'
